</style></head><body><div class="site"><div class="photo"></div><div class="shade"></div><header><div class="brand"><svg viewBox="0 0 160 27" aria-hidden="true"><path d="M5 21 Q22 18 39 10 Q56 3 76 4 Q94 4 107 12 Q129 12 153 20"/><path d="M17 24 Q38 20 48 17 M109 16 Q131 18 146 23"/></svg><div class="brand-name">Авто<span>-</span>Проф</div><div class="tag">Ваше желание — наше решение</div></div><nav><button data-open="Главная">Главная</button><button data-open="Услуги">Услуги</button><button data-open="Цены">Цены</button><button data-open="Отзывы">Отзывы</button><button data-open="Контакты">Контакты</button></nav><button class="contact" data-open="Контакты">☎ Связаться</button></header><main><section class="intro"><div class="eyebrow">Автосервис · Тюмень</div><h1>Авто-Проф</h1><svg class="curve" viewBox="0 0 350 30" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#bb8133"/><stop offset=".48" stop-color="#ffe3a8"/><stop offset="1" stop-color="#bf8538"/></linearGradient></defs><path fill="url(#gold)" d="M5 27 C90 4 151 3 210 13 C265 22 299 25 345 25 C295 27 256 25 208 19 C145 9 85 12 5 27 Z"/></svg><p>Профессиональное обслуживание<br>и ремонт легковых автомобилей</p></section><div class="benefits"><div class="benefit"><i>⚒</i> Опытные мастера</div><div class="benefit"><i>◷</i> Быстро и в срок</div><div class="benefit"><i>◇</i> Качество с гарантией</div><div class="benefit"><i>▣</i> Для всех марок авто</div></div><div class="actions"><button class="cta" data-open="Записаться на СТО">Записаться на СТО →</button><button class="cta alt" data-open="Как мы работаем">▷ &nbsp;Как мы работаем</button></div><div class="bottom">Демонстрационная версия · запись пока не подключена</div></main></div><div class="modal" id="modal" role="dialog" aria-modal="true"><div class="panel"><h2 id="modal-title"></h2><p id="modal-text"></p><button class="close" id="close">Закрыть</button></div></div><script>
