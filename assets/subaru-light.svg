<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 768" preserveAspectRatio="none">
  <defs>
    <linearGradient id="diagonal" x1="625" y1="745" x2="1240" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3263a6" stop-opacity="0"/>
      <stop offset=".35" stop-color="#548dc7" stop-opacity=".14"/>
      <stop offset=".7" stop-color="#aedbfa" stop-opacity=".24"/>
      <stop offset="1" stop-color="#467bb7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ground">
      <stop stop-color="#8cc5ef" stop-opacity=".12"/>
      <stop offset="1" stop-color="#5392cd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".14" stop-color="white"/>
      <stop offset=".76" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="edges" maskUnits="userSpaceOnUse" x="0" y="0" width="1366" height="768"><rect width="1366" height="768" fill="url(#fade)"/></mask>
    <filter id="soft" x="-55%" y="-55%" width="210%" height="210%"><feGaussianBlur stdDeviation="62"/></filter>
  </defs>
  <!-- Вершины определяют направление света; широкая растушёвка скрывает геометрию. -->
  <g mask="url(#edges)">
  <path d="M1150 260 550 768 1366 768Z" fill="url(#diagonal)" filter="url(#soft)"/>
  <ellipse cx="1035" cy="677" rx="355" ry="125" fill="url(#ground)"/>
  </g>
</svg>
