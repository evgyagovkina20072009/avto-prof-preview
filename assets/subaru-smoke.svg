<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <defs>
    <radialGradient id="cloud">
      <stop stop-color="#e3f5ff" stop-opacity=".52"/>
      <stop offset=".35" stop-color="#bbdff5" stop-opacity=".35"/>
      <stop offset=".7" stop-color="#78b1de" stop-opacity=".16"/>
      <stop offset="1" stop-color="#5595c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="smoke" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .019" numOctaves="3" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="48" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="wisp" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <!-- Шлейф расходится от задней части, поднимается справа и стелется по земле влево. -->
  <g fill="url(#cloud)" filter="url(#smoke)">
    <ellipse cx="823" cy="369" rx="105" ry="61"/>
    <ellipse cx="870" cy="299" rx="108" ry="82"/>
    <ellipse cx="881" cy="213" rx="122" ry="89"/>
    <ellipse cx="830" cy="131" rx="139" ry="99"/>
    <ellipse cx="755" cy="95" rx="111" ry="68" opacity=".6"/>
    <ellipse cx="699" cy="438" rx="169" ry="72" opacity=".55"/>
    <ellipse cx="515" cy="493" rx="185" ry="67" opacity=".65"/>
    <ellipse cx="323" cy="519" rx="148" ry="77"/>
    <ellipse cx="206" cy="531" rx="153" ry="90"/>
    <ellipse cx="128" cy="496" rx="104" ry="70" opacity=".7"/>
  </g>
  <g fill="none" stroke="#d4efff" stroke-opacity=".18" stroke-linecap="round" filter="url(#wisp)">
    <path d="M809 367C933 308 769 256 870 186S875 87 770 68" stroke-width="23"/>
    <path d="M824 397C701 501 501 458 350 521S209 489 109 534" stroke-width="21"/>
  </g>
</svg>
